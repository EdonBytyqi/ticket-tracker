services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tickets}
      POSTGRES_DB: tickets
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: tickets
      DB_PASSWORD: ${DB_PASSWORD:-tickets}
      DB_NAME: tickets
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen (siehe .env.example)}
      SEED_AGENT_EMAIL: ${SEED_AGENT_EMAIL:-agent@example.com}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:?SEED_AGENT_PASSWORD in .env setzen}
    depends_on:
      db:
        condition: service_healthy
    # Gesund erst, wenn die App laeuft UND die Datenbank erreicht (siehe /api/health).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dbdata:
